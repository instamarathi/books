name: Deploy to GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Bootstrap fonts for OG card generation
        run: |
          mkdir -p scripts/fonts
          curl -sL -A "Java/1.8.0_321" \
            "https://fonts.googleapis.com/css2?family=Inter:wght@400&family=Mukta:wght@400&display=swap" \
            -o /tmp/gfonts.css
          INTER_URL=$(grep -oE 'https://[^)]+inter[^)]+\.ttf' /tmp/gfonts.css | head -1)
          MUKTA_URL=$(grep -oE 'https://[^)]+mukta[^)]+\.ttf' /tmp/gfonts.css | head -1)
          if [ -z "$INTER_URL" ] || [ -z "$MUKTA_URL" ]; then
            echo "Could not extract font URLs from Google Fonts CSS"
            cat /tmp/gfonts.css
            exit 1
          fi
          curl -sL "$INTER_URL" -o scripts/fonts/Inter-Regular.ttf
          curl -sL "$MUKTA_URL" -o scripts/fonts/Mukta-Regular.ttf
          file scripts/fonts/*.ttf
      - run: npm run build
        env:
          VITE_BASE: /books/
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
